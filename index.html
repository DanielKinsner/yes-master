<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/landing/yes-master-icon.png" />
    <title>YES Master — master your track in real time</title>
    <meta
      name="description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did. Free public beta."
    />
    <link rel="canonical" href="https://www.yesdsp.com/" />
    <meta name="theme-color" content="#11151f" />

    <!--
      U8 — indexability is tied to the beta state, not left to chance.

      While no verified release existed this page carried
      `noindex, nofollow`: indexing a page whose download is closed sends people
      to a page that cannot give them the thing it describes.

      The owner published the release and ordered the site opened on
      2026-11-24 (UTC), so the tag is gone and the page is indexable.

      This is MECHANICALLY CHECKED in both directions: a test fails if noindex
      is present while a release resolves to available, and fails if it is
      absent while the release resolves to unavailable. When the beta window
      closes (`betaEndsAt` in src/landing/release-config.ts) that test asks for
      the tag back.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YES Master" />
    <meta property="og:title" content="YES Master — master your track in real time" />
    <meta
      property="og:description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did."
    />
    <meta property="og:url" content="https://www.yesdsp.com/" />
    <!-- Served from /public, so it is never part of the page's eager image
         budget: social crawlers fetch it, visitors never do. -->
    <meta property="og:image" content="https://www.yesdsp.com/og-card.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="The YES Master console" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.yesdsp.com/og-card.jpg" />
    <meta name="twitter:title" content="YES Master — master your track in real time" />
    <meta
      name="twitter:description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
