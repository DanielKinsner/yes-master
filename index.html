<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/landing/yes-master-icon.png" />
    <title>YES Master — master your track in real time</title>
    <meta
      name="description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did. Free public beta."
    />
    <link rel="canonical" href="https://yesmaster.app/" />
    <meta name="theme-color" content="#11151f" />

    <!--
      U8 — indexability is tied to the beta state, not left to chance.

      The landing page is not announced (docs/OWNER_INPUT_QUEUE.md: "Public beta
      announcement date and publication authorization"), and no verified release
      exists, so the download is closed. Letting search engines index it now
      would send people to a page that cannot give them the thing it describes,
      and would start the SEO clock on copy U6 is still shaping.

      This is the conservative default and it is MECHANICALLY CHECKED: a test
      asserts noindex is present while the release resolves to unavailable, and
      fails once it does not — so U17 cannot forget to remove it, and nobody can
      remove it early.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YES Master" />
    <meta property="og:title" content="YES Master — master your track in real time" />
    <meta
      property="og:description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did."
    />
    <meta property="og:url" content="https://yesmaster.app/" />
    <!-- Served from /public, so it is never part of the page's eager image
         budget: social crawlers fetch it, visitors never do. -->
    <meta property="og:image" content="https://yesmaster.app/og-card.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="The YES Master console" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yesmaster.app/og-card.jpg" />
    <meta name="twitter:title" content="YES Master — master your track in real time" />
    <meta
      name="twitter:description"
      content="A local-first desktop mastering app for Windows and macOS. Hear the full chain as you listen, then see a measured receipt of what it actually did."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
