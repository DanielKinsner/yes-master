name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows desktop and host bridge lanes
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            apps/iphone-native/rust/target
            apps/android-native/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'apps/iphone-native/rust/Cargo.lock', 'apps/android-native/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Windows package build
        run: npm run build:windows

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Android bridge host tests
        working-directory: apps/android-native/rust
        run: cargo test

      - name: iPhone bridge host tests
        working-directory: apps/iphone-native/rust
        run: cargo test

  macos:
    name: macOS desktop and iPhone lanes
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS simulator Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            apps/iphone-native/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'apps/iphone-native/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Desktop Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: macOS package build
        run: npm run build:mac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iPhone project
        working-directory: apps/iphone-native
        run: xcodegen generate

      - name: iPhone Swift tests
        working-directory: apps/iphone-native
        run: xcodebuild test -project YESMasterNative.xcodeproj -scheme YESMasterNative -destination 'platform=iOS Simulator,name=iPhone 16'

  android:
    name: Android host JVM lane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Remove local SDK override
        run: rm -f local.properties
        working-directory: apps/android-native

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android JVM tests
        working-directory: apps/android-native
        run: ./gradlew test
