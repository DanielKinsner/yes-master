name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  snapshot-diagnostics:
    name: Snapshot diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-snapshot-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-snapshot-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Write snapshot diagnostics
        shell: pwsh
        working-directory: src-tauri
        run: |
          New-Item -ItemType Directory -Force -Path snapshot-diagnostics | Out-Null
          $env:SNAPSHOT_DIAGNOSTIC_DIR = (Resolve-Path snapshot-diagnostics).Path
          cargo test --lib snapshot_diagnostics -- --ignored --nocapture

      - name: Upload snapshot diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diagnostics-${{ runner.os }}
          path: src-tauri/snapshot-diagnostics
          if-no-files-found: error

  windows:
    name: Windows desktop and host bridge lanes
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            apps/iphone-native/rust/target
            apps/android-native/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'apps/iphone-native/rust/Cargo.lock', 'apps/android-native/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Windows package build
        run: npm run build:windows

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Android bridge host tests
        working-directory: apps/android-native/rust
        run: cargo test

      - name: iPhone bridge host tests
        working-directory: apps/iphone-native/rust
        run: cargo test

  macos:
    name: macOS desktop and iPhone lanes
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS simulator Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            apps/iphone-native/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'apps/iphone-native/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Desktop Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: macOS package build
        run: npm run build:mac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iPhone project
        working-directory: apps/iphone-native
        run: xcodegen generate

      - name: iPhone Swift tests
        working-directory: apps/iphone-native
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin).get("devices", {}); preferred=("iPhone 16", "iPhone 15", "iPhone 14"); all_devices=[device for runtime in devices.values() for device in runtime if device.get("isAvailable")]; candidates=[device for device in all_devices if device.get("name", "").startswith("iPhone")] or all_devices; candidates.sort(key=lambda device: next((i for i, name in enumerate(preferred) if device.get("name") == name), len(preferred))); print(candidates[0]["udid"] if candidates else "")')"
          if [ -z "$SIMULATOR_UDID" ]; then
            RUNTIME_ID="$(xcrun simctl list runtimes --json | python3 -c 'import json, sys; runtimes=[runtime for runtime in json.load(sys.stdin).get("runtimes", []) if runtime.get("isAvailable") and runtime.get("platform") == "iOS"]; runtimes.sort(key=lambda runtime: runtime.get("version", ""), reverse=True); print(runtimes[0]["identifier"] if runtimes else "")')"
            DEVICE_TYPE="$(xcrun simctl list devicetypes --json | python3 -c 'import json, sys; preferred=("iPhone 16", "iPhone 15", "iPhone 14"); types=json.load(sys.stdin).get("devicetypes", []); candidates=[device_type for device_type in types if device_type.get("name") in preferred] or [device_type for device_type in types if device_type.get("name", "").startswith("iPhone")]; candidates.sort(key=lambda device_type: next((i for i, name in enumerate(preferred) if device_type.get("name") == name), len(preferred))); print(candidates[0]["identifier"] if candidates else "")')"
            if [ -z "$RUNTIME_ID" ] || [ -z "$DEVICE_TYPE" ]; then
              xcrun simctl list
              exit 70
            fi
            SIMULATOR_UDID="$(xcrun simctl create 'YES Master CI iPhone' "$DEVICE_TYPE" "$RUNTIME_ID")"
          fi
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test -project YESMasterNative.xcodeproj -scheme YESMasterNative -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO

  android:
    name: Android host JVM lane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Remove local SDK override
        run: rm -f local.properties
        working-directory: apps/android-native

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android JVM tests
        working-directory: apps/android-native
        run: ./gradlew test
