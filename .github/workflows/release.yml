name: Release

# Zero-cost public-beta release lane.
#
# Every run creates a DRAFT GitHub Release. The owner is the only person who
# publishes it. Windows and macOS builds work without paid OS-signing accounts,
# with the expected SmartScreen / Gatekeeper warning. Apple Developer ID and
# Azure Artifact Signing remain optional overlays for a later trust upgrade.
#
# Tauri updater signing is different: it is free, proves update authenticity,
# and is mandatory. Preflight fails before building if either updater secret is
# missing. See docs/RELEASE_SIGNING_SETUP.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required. Releases never ship update artifacts that the app cannot authenticate."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required."
            exit 1
          }

      - name: Validate optional OS-signing secret groups
        shell: pwsh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $apple = @(
            $env:APPLE_CERTIFICATE,
            $env:APPLE_CERTIFICATE_PASSWORD,
            $env:APPLE_ID,
            $env:APPLE_PASSWORD,
            $env:APPLE_TEAM_ID,
            $env:KEYCHAIN_PASSWORD
          )
          $azure = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID
          )

          $applePresent = @($apple | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          $azurePresent = @($azure | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count

          if ($applePresent -ne 0 -and $applePresent -ne $apple.Count) {
            Write-Error "Apple signing is optional, but a partial Apple secret set is unsafe. Add all six secrets or remove all six."
            exit 1
          }
          if ($azurePresent -ne 0 -and $azurePresent -ne $azure.Count) {
            Write-Error "Azure signing is optional, but a partial Azure secret set is unsafe. Add all three secrets or remove all three."
            exit 1
          }

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Validate release tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageCoreVersion = $packageVersion -replace '[-+].*$', ''

          if ("${{ github.ref_type }}" -ne "tag") {
            Write-Host "Manual release run; no pushed tag to validate. package.json version is $packageVersion."
            exit 0
          }

          $tagName = "${{ github.ref_name }}"
          if ($tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tagName' must look like v<semver>."
            exit 1
          }

          $tagCoreVersion = $Matches.version
          if ($tagCoreVersion -ne $packageCoreVersion) {
            Write-Error "Release tag '$tagName' resolves to $tagCoreVersion, but package.json is $packageVersion."
            exit 1
          }

      - name: Rust lib tests
        working-directory: src-tauri
        run: cargo test --lib

  release:
    name: Build draft (${{ matrix.label }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Universal)
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.platform }}

    env:
      # Non-secret switches keep credentials away from setup/build-tool steps.
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      AZURE_SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        if: ${{ matrix.platform == 'macos-latest' && env.APPLE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "Apple certificate was supplied, but no Developer ID Application identity was found." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      # The notarization trio must be ABSENT, not empty, when Apple signing is
      # off: tauri treats "all three env vars present" as "notarize", so
      # empty-but-set values sent it into notarization with a blank team ID
      # ("Team ID must be at least 3 characters", proving run 2026-07-27).
      # GITHUB_ENV is only written when the secrets exist; secret values stay
      # masked in logs either way.
      - name: Export Apple notarization credentials
        if: ${{ matrix.platform == 'macos-latest' && env.APPLE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Install Windows signing CLI
        if: ${{ matrix.platform == 'windows-latest' && env.AZURE_SIGNING_ENABLED == 'true' }}
        run: cargo install artifact-signing-cli

      - name: Assemble Tauri config overlays
        shell: bash
        run: |
          ARGS="--config src-tauri/tauri.updater.conf.json"
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "$AZURE_SIGNING_ENABLED" = "true" ]; then
            ARGS="$ARGS --config src-tauri/tauri.windows-signing.conf.json"
          fi
          echo "EXTRA_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID deliberately absent
          # here — the "Export Apple notarization credentials" step above
          # provides them only when Apple signing is configured, because
          # empty-but-set values make tauri attempt notarization with blanks.
          # "-" = ad-hoc signing, the documented $0-lane default (matches
          # signingIdentity in tauri.conf.json). Without the fallback, a run
          # with NO Apple secrets exported an empty-but-set
          # APPLE_SIGNING_IDENTITY, which overrides the config and made the
          # bundler run `codesign -s ""` -> "no identity found" (first tag
          # run, 2026-07-27). The fail-closed guard for PARTIAL secret groups
          # lives in the import step above, which still exits 1 when a
          # certificate is supplied but no identity is found.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || '-' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('yes-master-v__VERSION__-manual-{0}', github.run_number) }}
          releaseName: "YES Master __VERSION__ — Public Beta"
          releaseBody: |
            Early public beta for Windows and macOS.

            The $0 release lane is not yet backed by paid Apple/Microsoft publisher certificates, so the operating system may show an unknown-developer warning. Verify SHA256SUMS.txt, follow the [beta install guide](https://github.com/DanielKinsner/yes-master/blob/main/docs/BETA_INSTALL.md), and only install files downloaded from this repository.

            **New here?** The [beta testing guide](https://github.com/DanielKinsner/yes-master/blob/main/docs/BETA_TESTING.md) covers what is most useful to test, what is already known to be rough, how to save a diagnostics report, and what happens to your install when the beta ends.

            Found something? Open a [bug report](https://github.com/DanielKinsner/yes-master/issues/new?template=beta-bug.yml) or send [workflow feedback](https://github.com/DanielKinsner/yes-master/issues/new?template=beta-feedback.yml). Issues are public and need a free GitHub account — please describe your audio rather than uploading it.
          releaseDraft: true
          # The app checks /releases/latest/download/latest.json. GitHub excludes
          # prereleases from that channel, so beta identity lives in tag/title.
          prerelease: false
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}

  release-audit:
    name: Audit complete draft
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "yes-master-v$packageVersion-manual-${{ github.run_number }}"
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          gh release download $env:RELEASE_TAG --dir release-assets
          $lines = Get-ChildItem -LiteralPath release-assets -File |
            Where-Object Name -ne "SHA256SUMS.txt" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber

      - name: Audit draft release assets
        shell: pwsh
        run: |
          # The releases/tags/<tag> endpoint resolves PUBLISHED releases only —
          # a draft is not attached to a tag ref yet, so it 404s, the parsed
          # object comes back empty, and "-not $release.draft" misfired as
          # "must leave the release as a draft" (proving run 2, 2026-07-27).
          # List and match tag_name instead; drafts appear there with auth.
          $release = gh api "repos/${{ github.repository }}/releases?per_page=30" |
            ConvertFrom-Json |
            Where-Object { $_.tag_name -eq $env:RELEASE_TAG } |
            Select-Object -First 1
          if (-not $release) {
            Write-Error "No release (draft or published) found for tag $env:RELEASE_TAG."
            exit 1
          }
          if (-not $release.draft) {
            Write-Error "The workflow must leave the release as a draft for owner review."
            exit 1
          }
          if ($release.prerelease) {
            Write-Error "The beta updater uses GitHub's latest channel, which excludes prereleases."
            exit 1
          }

          $names = @($release.assets | ForEach-Object { $_.name })
          $required = [ordered]@{
            "universal macOS installer (.dmg)" = '\.dmg$'
            "macOS updater bundle (.app.tar.gz)" = '\.app\.tar\.gz$'
            "Windows MSI installer (.msi)" = '\.msi$'
            "Windows NSIS installer (setup.exe)" = 'setup\.exe$'
            "updater manifest (latest.json)" = '^latest\.json$'
            "macOS updater signature (.app.tar.gz.sig)" = '\.app\.tar\.gz\.sig$'
            "Windows MSI updater signature (.msi.sig)" = '\.msi\.sig$'
            "Windows NSIS updater signature (setup.exe.sig)" = 'setup\.exe\.sig$'
            "SHA-256 checksum ledger" = '^SHA256SUMS\.txt$'
          }

          foreach ($entry in $required.GetEnumerator()) {
            if (-not ($names | Where-Object { $_ -match $entry.Value })) {
              Write-Error "Draft is incomplete: missing $($entry.Key). Assets: $($names -join ', ')"
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath release-assets\latest.json -Raw | ConvertFrom-Json
          $platforms = @($manifest.platforms.PSObject.Properties.Name)
          if (-not ($platforms | Where-Object { $_ -match 'darwin' })) {
            Write-Error "Updater manifest is missing macOS. Platforms: $($platforms -join ', ')"
            exit 1
          }
          if (-not ($platforms | Where-Object { $_ -match 'windows' })) {
            Write-Error "Updater manifest is missing Windows. Platforms: $($platforms -join ', ')"
            exit 1
          }

          Write-Host "Draft release is complete and remains unpublished: $env:RELEASE_TAG"
