name: Release

# Cuts a signed, downloadable release. Push a version tag (e.g. v0.1.0-beta.1)
# and this builds macOS (Apple Silicon + Intel) and Windows installers, then
# creates a DRAFT GitHub Release with them attached for you to review + publish.
#
# Signing auto-activates when the relevant secrets exist (see
# docs/RELEASE_SIGNING_SETUP.md). Until then, builds still succeed — just
# UNSIGNED (users get an "unknown developer" warning on download).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as a pre-release (beta)"
        type: boolean
        default: true

# tauri-action creates a GitHub Release, which needs write access to contents.
permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Validate release tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageCoreVersion = $packageVersion -replace '[-+].*$', ''

          if ("${{ github.ref_type }}" -ne "tag") {
            Write-Host "Manual release run; no pushed tag to validate. package.json version is $packageVersion."
            exit 0
          }

          $tagName = "${{ github.ref_name }}"
          if ($tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tagName' must look like v<semver>."
            exit 1
          }

          $tagCoreVersion = $Matches.version
          if ($tagCoreVersion -ne $packageCoreVersion) {
            Write-Error "Release tag '$tagName' resolves to $tagCoreVersion, but package.json is $packageVersion."
            exit 1
          }

      - name: Rust lib tests
        working-directory: src-tauri
        run: cargo test --lib

  release:
    name: Build & release (${{ matrix.label }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.platform }}

    # Secrets are mapped to env so we can BOTH gate steps on their presence with
    # `if:` AND hand them to tauri-action. Empty until you add them in
    # repo Settings -> Secrets and variables -> Actions.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Tauri updater signing (Slice 7). tauri-action reads these to sign the
      # updater artifacts (latest.json + per-installer .sig). Empty until the
      # owner generates the keypair and adds the secrets (see
      # docs/RELEASE_SIGNING_SETUP.md); updater artifacts are only created when
      # the private key is present.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # ---- macOS code signing + notarization ----
      # Auto-enabled once the APPLE_CERTIFICATE secret exists. Imports the
      # Developer ID Application cert into a temp keychain and exposes its
      # identity as APPLE_SIGNING_IDENTITY for tauri-action. Notarization runs
      # automatically when APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are set.
      - name: Import Apple Developer ID certificate
        if: ${{ startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported signing identity: $CERT_ID"

      # ---- Windows code signing (Azure Trusted Signing) ----
      # Auto-enabled once the AZURE_* secrets exist. NOTE: the signing CLI crate
      # name is in flux upstream — verify the current binary/crate name against
      # https://v2.tauri.app/distribute/sign/windows/ before your first signed
      # release (this is the one line we agreed to confirm together).
      - name: Install Windows signing CLI
        if: ${{ matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != '' }}
        run: cargo install trusted-signing-cli

      - name: Assemble tauri build config overlays
        shell: bash
        # Both overlays are named so they do NOT match Tauri's
        # `tauri.<platform>.conf.json` auto-merge pattern; each is applied only
        # here via --config, so local builds stay buildable without CI secrets.
        #   - Windows signing overlay: only when the Azure creds exist.
        #   - Updater-artifacts overlay: only when the updater signing key
        #     exists (createUpdaterArtifacts requires the key at build time).
        run: |
          ARGS=""
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            ARGS="$ARGS --config src-tauri/tauri.windows-signing.conf.json"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ARGS="$ARGS --config src-tauri/tauri.updater.conf.json"
          fi
          echo "EXTRA_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Build, sign & draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('yes-master-v__VERSION__-manual-{0}', github.run_number) }}
          releaseName: "YES Master __VERSION__"
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: true
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}
