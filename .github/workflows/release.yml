name: Release

# Zero-cost public-beta release lane.
#
# Every run creates a DRAFT GitHub Release. The owner is the only person who
# publishes it. Windows and macOS builds work without paid OS-signing accounts,
# with the expected SmartScreen / Gatekeeper warning. Apple Developer ID and
# Azure Artifact Signing remain optional overlays for a later trust upgrade.
#
# Tauri updater signing is different: it is free, proves update authenticity,
# and is mandatory. Preflight fails before building if either updater secret is
# missing. See docs/RELEASE_SIGNING_SETUP.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: windows-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require updater signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required. Releases never ship update artifacts that the app cannot authenticate."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required."
            exit 1
          }

      - name: Validate optional OS-signing secret groups
        shell: pwsh
        run: |
          $apple = @(
            $env:APPLE_CERTIFICATE,
            $env:APPLE_CERTIFICATE_PASSWORD,
            $env:APPLE_ID,
            $env:APPLE_PASSWORD,
            $env:APPLE_TEAM_ID,
            $env:KEYCHAIN_PASSWORD
          )
          $azure = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID
          )

          $applePresent = @($apple | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          $azurePresent = @($azure | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count

          if ($applePresent -ne 0 -and $applePresent -ne $apple.Count) {
            Write-Error "Apple signing is optional, but a partial Apple secret set is unsafe. Add all six secrets or remove all six."
            exit 1
          }
          if ($azurePresent -ne 0 -and $azurePresent -ne $azure.Count) {
            Write-Error "Azure signing is optional, but a partial Azure secret set is unsafe. Add all three secrets or remove all three."
            exit 1
          }

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Validate release tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageCoreVersion = $packageVersion -replace '[-+].*$', ''

          if ("${{ github.ref_type }}" -ne "tag") {
            Write-Host "Manual release run; no pushed tag to validate. package.json version is $packageVersion."
            exit 0
          }

          $tagName = "${{ github.ref_name }}"
          if ($tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tagName' must look like v<semver>."
            exit 1
          }

          $tagCoreVersion = $Matches.version
          if ($tagCoreVersion -ne $packageCoreVersion) {
            Write-Error "Release tag '$tagName' resolves to $tagCoreVersion, but package.json is $packageVersion."
            exit 1
          }

      - name: Rust lib tests
        working-directory: src-tauri
        run: cargo test --lib

  release:
    name: Build draft (${{ matrix.label }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Universal)
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.platform }}

    env:
      # Optional paid trust overlays. Empty is the supported $0 beta path.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # Mandatory, free Tauri updater signing.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        if: ${{ matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "Apple certificate was supplied, but no Developer ID Application identity was found." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Install Windows signing CLI
        if: ${{ matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != '' }}
        run: cargo install artifact-signing-cli

      - name: Assemble Tauri config overlays
        shell: bash
        run: |
          ARGS="--config src-tauri/tauri.updater.conf.json"
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            ARGS="$ARGS --config src-tauri/tauri.windows-signing.conf.json"
          fi
          echo "EXTRA_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('yes-master-v__VERSION__-manual-{0}', github.run_number) }}
          releaseName: "YES Master __VERSION__ — Public Beta"
          releaseBody: |
            Early public beta for Windows and macOS.

            The $0 release lane is not yet backed by paid Apple/Microsoft publisher certificates, so the operating system may show an unknown-developer warning. Verify SHA256SUMS.txt, follow the [beta install guide](https://github.com/DanielKinsner/yes-master/blob/main/docs/BETA_INSTALL.md), and only install files downloaded from this repository.
          releaseDraft: true
          # The app checks /releases/latest/download/latest.json. GitHub excludes
          # prereleases from that channel, so beta identity lives in tag/title.
          prerelease: false
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}

  release-audit:
    name: Audit complete draft
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "yes-master-v$packageVersion-manual-${{ github.run_number }}"
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          gh release download $env:RELEASE_TAG --dir release-assets
          $lines = Get-ChildItem -LiteralPath release-assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber

      - name: Audit draft release assets
        shell: pwsh
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if (-not $release.draft) {
            Write-Error "The workflow must leave the release as a draft for owner review."
            exit 1
          }
          if ($release.prerelease) {
            Write-Error "The beta updater uses GitHub's latest channel, which excludes prereleases."
            exit 1
          }

          $names = @($release.assets | ForEach-Object { $_.name })
          $required = [ordered]@{
            "universal macOS installer (.dmg)" = '\.dmg$'
            "macOS updater bundle (.app.tar.gz)" = '\.app\.tar\.gz$'
            "Windows MSI installer (.msi)" = '\.msi$'
            "Windows NSIS installer (setup.exe)" = 'setup\.exe$'
            "updater manifest (latest.json)" = '^latest\.json$'
            "macOS updater signature (.app.tar.gz.sig)" = '\.app\.tar\.gz\.sig$'
            "Windows MSI updater signature (.msi.sig)" = '\.msi\.sig$'
            "Windows NSIS updater signature (setup.exe.sig)" = 'setup\.exe\.sig$'
            "SHA-256 checksum ledger" = '^SHA256SUMS\.txt$'
          }

          foreach ($entry in $required.GetEnumerator()) {
            if (-not ($names | Where-Object { $_ -match $entry.Value })) {
              Write-Error "Draft is incomplete: missing $($entry.Key). Assets: $($names -join ', ')"
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath release-assets\latest.json -Raw | ConvertFrom-Json
          $platforms = @($manifest.platforms.PSObject.Properties.Name)
          if (-not ($platforms | Where-Object { $_ -match 'darwin' })) {
            Write-Error "Updater manifest is missing macOS. Platforms: $($platforms -join ', ')"
            exit 1
          }
          if (-not ($platforms | Where-Object { $_ -match 'windows' })) {
            Write-Error "Updater manifest is missing Windows. Platforms: $($platforms -join ', ')"
            exit 1
          }

          Write-Host "Draft release is complete and remains unpublished: $env:RELEASE_TAG"
