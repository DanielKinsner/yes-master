[package]
name = "yes-master-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser try-it: the YES Master Standard chain compiled to WebAssembly. Pulls dsp.rs + types.rs from src-tauri by path; nothing in the app crate changes."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
ebur128 = "0.1"
rustfft = "6"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
hound = "3"
