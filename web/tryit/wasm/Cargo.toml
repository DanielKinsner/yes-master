[package]
name = "yes-master-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser try-it: the YES Master Standard chain plus whole-track source analysis and adaptive guardrails, compiled to WebAssembly. Pulls the desktop sources from src-tauri by path."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
ebur128 = "0.1"
rustfft = "6"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
# Speed over size: this is what makes tweaks feel live. Measured 2026-09-14 in
# Chrome on the office PC (30 s stereo 44.1 kHz excerpt, one cold render, and
# decode+analysis "ready" for a 40 s WAV): opt-level 3 = ~0.36 s render, 0.8 s
# ready; "s" = ~0.48 s render, 1.3 s ready; "z" produced a LARGER binary than
# "s" here (749 vs 386 KB pre-bindgen) and was not timed. The wasm ships once
# per visitor, gzipped, so the ~100 KB "3" costs over "s" is worth the 25-40%.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
hound = "3"
