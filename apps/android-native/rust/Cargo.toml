[package]
name = "yes-master-android-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yes_master_android_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde_json = "1"
# The iPhone-named crate is the platform-neutral native facade (analyze /
# render / settings / live_stream behind a C ABI) — Android reuses it as an
# rlib instead of duplicating it. Renaming the package is parked (it would
# churn the Xcode project); the alias keeps call sites honest.
native_bridge = { package = "yes-master-iphone-native-bridge", path = "../../iphone-native/rust" }
yes_master_lib = { package = "yes-master", path = "../../../src-tauri", default-features = false }

[dev-dependencies]
futures-executor = "0.3"
hound = "3"
tempfile = "3"

# Same trick as the iPhone bridge: engine deps at release speed even in dev
# builds so on-device DSP is realistic while the bridge stays fast to build.
[profile.dev.package."*"]
opt-level = 3
