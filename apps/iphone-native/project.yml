name: YESMasterNative
options:
  bundleIdPrefix: com.yesmaster.iphone
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: YES Master Native
    PRODUCT_BUNDLE_IDENTIFIER: com.yesmaster.iphone.native
    DEVELOPMENT_TEAM: C4ZKT5JJ3K
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  YESMasterNative:
    type: application
    platform: iOS
    sources:
      - path: YESMasterNative
    info:
      path: YESMasterNative/Info.plist
      properties:
        CFBundleDisplayName: YES Master
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSDocumentsFolderUsageDescription: YES Master imports audio files you choose and exports finished masters.
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/rust/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/rust/build/$(PLATFORM_NAME)/$(CONFIGURATION)
        OTHER_LDFLAGS:
          - -lyes_master_iphone_native_bridge
        SWIFT_OBJC_BRIDGING_HEADER: YESMasterNative/YESMasterNative-Bridging-Header.h
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-rust-bridge.sh"
  YESMasterNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YESMasterNativeTests
    dependencies:
      - target: YESMasterNative
    settings:
      base:
        PRODUCT_NAME: YESMasterNativeTests
        PRODUCT_MODULE_NAME: YESMasterNativeTests
        PRODUCT_BUNDLE_IDENTIFIER: com.yesmaster.iphone.native.tests
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/rust/include
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YES Master Native.app/YES Master Native"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  YESMasterNative:
    build:
      targets:
        YESMasterNative: all
    test:
      targets:
        - YESMasterNativeTests
