[package]
name = "yes-master-iphone-native-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib: linked into the iOS app by scripts/build-rust-bridge.sh.
# rlib: consumed by the Android bridge crate (and the crate's own tests).
# (A `cdylib` entry sat here unused by any link step — removed 2026-07-03,
# audit Batch H tail.)
crate-type = ["staticlib", "rlib"]
name = "yes_master_iphone_native_bridge"

[dependencies]
futures-executor = "0.3"
serde_json = "1.0"
yes_master_lib = { package = "yes-master", path = "../../../src-tauri", default-features = false }

[dev-dependencies]
hound = "3"
tempfile = "3"

# Optimize dependencies (yes_master_lib, symphonia, rustfft, ebur128) even in
# Debug app builds, so on-device DSP runs at release speed. The bridge crate
# itself stays unoptimized for fast iteration.
[profile.dev.package."*"]
opt-level = 3
